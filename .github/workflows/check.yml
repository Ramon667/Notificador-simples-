name: Monitorar vagas Senac PI

on:
  schedule:
    # Roda a cada 30 minutos.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: senac-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema (OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          KEYWORD: "enfermagem"
        run: python monitor.py

      - name: Salvar estado (seen.json) de volta no repositório
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add seen.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração no seen.json."
            exit 0
          fi

          git commit -m "Atualiza estado de editais vistos"

          git pull --rebase origin main
          git push origin HEAD:main
          
