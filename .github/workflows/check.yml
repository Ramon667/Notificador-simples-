name: Monitorar vagas Senac PI

on:
  schedule:
    # Roda a cada 30 minutos. Ajuste conforme quiser.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write   # necessário para o job poder commitar o seen.json atualizado

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema (OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          KEYWORD: "enfermagem"
        run: python monitor.py

      - name: Salvar estado (seen.json) de volta no repositório
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add seen.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualiza estado de editais vistos"
          git push
          
