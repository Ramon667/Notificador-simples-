name: Monitorar vagas Senac PI

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: senac-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m py_compile monitor.py

      - name: Executar testes
        run: python test_monitor.py -v

      - name: Rodar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python monitor.py

      - name: Publicar resumo
        if: always()
        run: |
          if [ -f status.json ]; then
            {
              echo "## Status do monitor SENAC"
              echo
              echo '```json'
              cat status.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Salvar estado, histórico e dashboard
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # Adiciona somente os arquivos que realmente existem.
          for file in seen.json status.json history.json docs/index.html; do
            if [ -e "$file" ]; then
              git add "$file"
            else
              echo "Arquivo ainda não gerado: $file"
            fi
          done

          if git diff --staged --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualiza monitor SENAC"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"

  deploy-pages:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout atualizado
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
