name: Monitorar vagas Senac PI

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: senac-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m py_compile monitor.py

      - name: Executar testes
        run: python test_monitor.py -v

      - name: Rodar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python monitor.py

      - name: Publicar resumo
        if: always()
        run: |
          if [ -f status.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime

          with open("status.json", "r", encoding="utf-8") as f:
              status = json.load(f)

          local = status.get("finished_at_local") or status.get("started_at_local")
          utc = status.get("finished_at_utc") or status.get("started_at_utc")

          def format_local(value):
              if not value:
                  return "—"
              return datetime.fromisoformat(value).strftime("%d/%m/%Y %H:%M:%S") + " (GMT-3)"

          def format_utc(value):
              if not value:
                  return "—"
              return datetime.fromisoformat(value).strftime("%d/%m/%Y %H:%M:%S") + " UTC"

          print("## Execução do Monitor SENAC")
          print()
          print(f"🕒 **Horário local:** {format_local(local)}")
          print()
          print(f"🌍 **Horário UTC:** {format_utc(utc)}")
          print()
          print(f"📍 **Fuso:** {status.get('timezone', 'America/Fortaleza')}")
          print()
          print(f"✅ **Sucesso:** {status.get('success')}")
          print()
          print(f"📄 **PDFs encontrados:** {status.get('pdfs_found', 0)}")
          print()
          print(f"🆕 **PDFs novos:** {status.get('new_pdfs', 0)}")
          print()
          print(f"🎯 **Matches:** {status.get('matches', 0)}")
          print()
          print(f"📲 **ntfy enviados:** {status.get('ntfy_sent', 0)}")
          print()
          print("### Dados técnicos")
          print()
          print("```json")
          print(json.dumps(status, ensure_ascii=False, indent=2))
          print("```")
          PY
          else
            echo "status.json não foi gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Garantir diretório do dashboard
        if: always()
        run: |
          mkdir -p docs
          if [ ! -f docs/index.html ]; then
            cat > docs/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Monitor SENAC PI</title>
          </head>
          <body>
            <h1>Monitor SENAC PI</h1>
            <p>O dashboard ainda não foi gerado nesta execução.</p>
          </body>
          </html>
          HTML
          fi

      - name: Configurar GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Enviar artefato do dashboard
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Salvar estado, histórico e dashboard
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          for file in seen.json status.json history.json docs/index.html; do
            if [ -e "$file" ]; then
              git add "$file"
            else
              echo "Arquivo ainda não gerado: $file"
            fi
          done

          if git diff --staged --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualiza monitor SENAC"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"

  deploy-pages:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
